name: Biz Mock Production Isolation

on:
  pull_request:
    branches: [develop]
  push:
    branches: ['feat/screen-registry-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    name: biz-mock isolation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check non-production isolation
        working-directory: apps/mobile
        run: node scripts/check-biz-mock-production-isolation.mjs
