name: Android Startup KPI

# Measures the Android cold-start KPI that `am start -W TotalTime` cannot see:
# time from native process start to the first user-visible surface (unlock or
# Home).
#
# The default target is a pinned Pixel 7 / API 35 emulator, created on demand,
# because a measurement device has to be available on every run and stay
# identical between runs. A physical device can be selected instead with
# `runner_target=physical`.
#
# A package that never emits the marker is reported as INVALID: that is a
# broken measurement (wrong APK, fresh install stuck on onboarding), never a
# "no difference" result.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK to measure (HTTPS URL)'
        required: true
        type: string
      apk_label:
        description: 'Label for apk_url (defaults to the file name)'
        required: false
        type: string
        default: ''
      baseline_apk_url:
        description: 'Optional second APK to compare against (HTTPS URL)'
        required: false
        type: string
        default: ''
      baseline_apk_label:
        description: 'Label for baseline_apk_url (defaults to the file name)'
        required: false
        type: string
        default: ''
      runs:
        description: 'Cold starts per package'
        required: true
        type: choice
        options:
          - '3'
          - '5'
          - '7'
        default: '5'
      runner_target:
        description: 'Measure on the pinned emulator or on a physical device'
        required: true
        type: choice
        options:
          - emulator
          - physical
        default: emulator
      device_serial:
        description: 'physical only: adb serial (empty = first connected device)'
        required: false
        type: string
        default: ''
      emulator_avd:
        description: 'emulator only: AVD name'
        required: false
        type: string
        default: 'rabby-startup-pixel7-api35'
      settle_seconds:
        description: >-
          Idle time after seeding, so the imported accounts can fetch and
          persist their data before the cold starts are measured.
        required: false
        type: string
        default: '35'
      package_name:
        description: 'Application id'
        required: false
        type: string
        default: 'com.debank.rabbymobile.regression'
      notify_lark:
        description: 'Push the result to the mobile Lark chat'
        required: true
        type: boolean
        default: true

defaults:
  run:
    shell: bash -euo pipefail {0}

# One measurement device, one run at a time.
concurrency:
  group: rabby-android-startup-kpi-device
  cancel-in-progress: false

jobs:
  measure:
    name: Measure cold start
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - mobile-local
    timeout-minutes: 60
    env:
      APK_URL: ${{ inputs.apk_url }}
      APK_LABEL: ${{ inputs.apk_label }}
      BASELINE_APK_URL: ${{ inputs.baseline_apk_url }}
      BASELINE_APK_LABEL: ${{ inputs.baseline_apk_label }}
      RUNS: ${{ inputs.runs }}
      RUNNER_TARGET: ${{ inputs.runner_target }}
      DEVICE_SERIAL_INPUT: ${{ inputs.device_serial }}
      AVD_NAME: ${{ inputs.emulator_avd }}
      SETTLE_SECONDS: ${{ inputs.settle_seconds }}
      PACKAGE_NAME: ${{ inputs.package_name }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: false

      - name: Check tooling
        run: |
          command -v adb || true
          adb version
          adb devices
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          # runner.* is not available in job-level env, so resolve it here.
          echo "RESULT_FILE=$RUNNER_TEMP/startup-kpi-result.json" >> "$GITHUB_ENV"

      - name: Download packages
        run: |
          work="$RUNNER_TEMP/startup-kpi"
          rm -rf "$work"
          mkdir -p "$work"

          fetch() {
            # fetch <url> <label> <output-path>
            local url="$1" label="$2" out="$3"
            case "$url" in
              https://*) ;;
              *) echo "only https:// package URLs are accepted" >&2; exit 1 ;;
            esac
            if [ -e "$out" ]; then
              echo "duplicate label '$(basename "$out" .apk)' - pass distinct labels" >&2
              exit 1
            fi
            curl --fail --location --silent --show-error --retry 3 \
              --proto '=https' --tlsv1.2 "$url" --output "$out"
            test -s "$out"
            unzip -tq "$out" >/dev/null
            echo "downloaded ${label} -> $out"
          }

          label="${APK_LABEL:-$(basename "${APK_URL%%\?*}")}"
          label="${label%.apk}"
          fetch "$APK_URL" "$label" "$work/$label.apk"
          echo "APK_MAIN=$work/$label.apk" >> "$GITHUB_ENV"

          if [ -n "${BASELINE_APK_URL}" ]; then
            baseline_label="${BASELINE_APK_LABEL:-$(basename "${BASELINE_APK_URL%%\?*}")}"
            baseline_label="${baseline_label%.apk}"
            fetch "$BASELINE_APK_URL" "$baseline_label" "$work/$baseline_label.apk"
            echo "APK_BASELINE=$work/$baseline_label.apk" >> "$GITHUB_ENV"
          fi

      - name: Boot emulator
        if: ${{ inputs.runner_target == 'emulator' }}
        env:
          EMULATOR_LOG: ${{ runner.temp }}/startup-kpi-emulator.log
          # Every comparison must start from the same emulator state.
          WIPE: '1'
        run: |
          bash apps/mobile/scripts/startup-kpi/emulator.sh ensure
          bash apps/mobile/scripts/startup-kpi/emulator.sh boot
          bash apps/mobile/scripts/startup-kpi/emulator.sh wait
          echo "DEVICE_SERIAL=emulator-5554" >> "$GITHUB_ENV"

      - name: Resolve physical device
        if: ${{ inputs.runner_target == 'physical' }}
        run: |
          serial="${DEVICE_SERIAL_INPUT:-$(adb devices | awk '$2 == "device" { print $1; exit }')}"
          if [ -z "$serial" ]; then
            echo "no connected android device" >&2
            exit 1
          fi
          echo "DEVICE_SERIAL=$serial" >> "$GITHUB_ENV"

      - name: Prepare device
        run: |
          # A locked/sleeping device changes the measured surface.
          adb -s "$DEVICE_SERIAL" shell input keyevent KEYCODE_WAKEUP || true
          adb -s "$DEVICE_SERIAL" shell wm dismiss-keyguard || true
          adb -s "$DEVICE_SERIAL" shell settings put global stay_on_while_plugged_in 3 || true
          # Animation scales change what "first content frame" looks like.
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb -s "$DEVICE_SERIAL" shell settings put global "$scale" 0 || true
          done
          echo "device=$DEVICE_SERIAL"

      - name: Seed device state
        run: |
          # Machine-local only: the key list lives in the runner's own .env
          # (one entry per line, newlines escaped as \n), never in the repo or
          # in repository secrets. A plain file next to the runner works too.
          accounts_file="${RABBY_KPI_TEST_ACCOUNTS_FILE:-}"
          if [ -n "${RABBY_KPI_TEST_ACCOUNTS:-}" ]; then
            accounts_file="$RUNNER_TEMP/kpi-test-accounts.txt"
            ( umask 077; printf '%b\n' "$RABBY_KPI_TEST_ACCOUNTS" > "$accounts_file" )
            echo "test-account list from the runner env: $(grep -c . "$accounts_file") entries"
          elif [ -z "$accounts_file" ] && [ -f "$HOME/.rabby-kpi/test-accounts.txt" ]; then
            accounts_file="$HOME/.rabby-kpi/test-accounts.txt"
          fi

          # The measured package carries the seeding deeplinks, so it has to be
          # installed before the state can be built.
          adb -s "$DEVICE_SERIAL" install -r "$APK_MAIN"
          bash apps/mobile/scripts/startup-kpi/seed-device.sh ensure-address \
            --device "$DEVICE_SERIAL" --pkg "$PACKAGE_NAME"

          if [ -f "$accounts_file" ]; then
            bash apps/mobile/scripts/startup-kpi/seed-device.sh import-accounts \
              --device "$DEVICE_SERIAL" --pkg "$PACKAGE_NAME" \
              --file "$accounts_file" --settle "$SETTLE_SECONDS"
          else
            echo "::warning::no test-account list at $accounts_file; measuring without imported accounts"
          fi

          adb -s "$DEVICE_SERIAL" shell am force-stop "$PACKAGE_NAME"
          sleep 2

      - name: Collect startup KPI
        id: collect
        run: |
          args=(--apk "$APK_MAIN" --json "$RESULT_FILE" --runs "$RUNS" --pkg "$PACKAGE_NAME")
          args+=(--device "$DEVICE_SERIAL")
          if [ -n "${APK_BASELINE:-}" ]; then
            args+=(--apk "$APK_BASELINE")
          fi

          status=0
          bash apps/mobile/scripts/startup-kpi/collect.sh "${args[@]}" || status=$?
          echo "collect_exit=$status" >> "$GITHUB_OUTPUT"
          {
            echo '### Android startup KPI'
            echo '```'
            if [ -f "$RESULT_FILE" ]; then
              RESULT_FILE="$RESULT_FILE" node -e '
                const r = require(process.env.RESULT_FILE);
                for (const p of r.packages || []) {
                  console.log(
                    p.result === "OK"
                      ? `${p.label}: ${p.contentMedianMs}ms (${p.contentMinMs}-${p.contentMaxMs}) route ${JSON.stringify(p.routes)}`
                      : `${p.label}: INVALID`,
                  );
                }
              '
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report to Lark
        if: ${{ always() && inputs.notify_lark }}
        env:
          RABBY_STARTUP_KPI_RESULT_FILE: ${{ runner.temp }}/startup-kpi-result.json
          RABBY_MOBILE_LARK_CHAT_URL: ${{ secrets.RABBY_MOBILE_LARK_CHAT_URL || secrets.LARK_CHAT_URL }}
          RABBY_MOBILE_LARK_CHAT_SECRET: ${{ secrets.RABBY_MOBILE_LARK_CHAT_SECRET || secrets.LARK_CHAT_SECRET }}
          GIT_ACTIONS_JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ ! -f "$RABBY_STARTUP_KPI_RESULT_FILE" ]; then
            echo "no result file; skipping Lark report"
            exit 0
          fi
          node apps/mobile/scripts/startup-kpi/notify-lark.js

      - name: Stop emulator
        if: ${{ always() && inputs.runner_target == 'emulator' }}
        run: |
          adb -s emulator-5554 emu kill || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-kpi-result
          path: ${{ runner.temp }}/startup-kpi-result.json
          if-no-files-found: warn
