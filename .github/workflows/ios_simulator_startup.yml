name: iOS Simulator Startup

on:
  push:
    branches:
      - 'publish/*'
      # Temporary: validate this workflow on CI before merging it into develop.
      - 'feat/ios-simulator-startup-ci'
  workflow_dispatch:
    inputs:
      macos_machine_location:
        description: Apple Silicon runner with the required Xcodes and runtimes
        type: choice
        options: [mobile, mobile-local]
        default: mobile
      build_xcode:
        description: App compiler (26.3 matches release; 27.1 tests the newer SDK)
        type: choice
        options: ['26.3', '27.1']
        default: '26.3'
      ios_majors:
        description: Required iOS majors; a manual subset is reported as partial coverage
        type: string
        default: '16,17,18,26,27'

permissions:
  contents: read

# Independent of Feature Test/release concurrency and status. Queue pushes
# instead of cancelling an older publish branch's pending check.
concurrency:
  group: ios-simulator-startup-${{ inputs.macos_machine_location || 'mobile' }}
  cancel-in-progress: false
  queue: max

jobs:
  startup:
    if: github.repository == 'RabbyHub/rabby-mobile' && (github.event_name != 'push' || github.event.deleted != true)
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ inputs.macos_machine_location || 'mobile' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: ios-startup-source
    env:
      REALLY_UPLOAD: 'false'
      SKIP_NOTIFY_LARK: 'true'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      RABBY_MOBILE_TURBO_BUILD: 'true'
      RABBY_MOBILE_TURBO_REMOTE_SYNC: 'false'
      RABBY_MOBILE_METRO_USE_CACHE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: ios-startup-source
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check the startup harness contracts
        run: |
          node --test scripts/ios-startup-smoke/run.test.mjs \
            apps/mobile/scripts/ci/build-ios-simulator.test.cjs

      - name: Validate tooling and complete runtime coverage before building
        env:
          REQUESTED_MAJORS: ${{ inputs.ios_majors || '16,17,18,26,27' }}
          BUILD_XCODE: ${{ inputs.build_xcode || '26.3' }}
        run: |
          EVIDENCE_ROOT="$RUNNER_TEMP/rabby-ios-startup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$EVIDENCE_ROOT"
          printf 'EVIDENCE_ROOT=%s\n' "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          node scripts/ios-startup-smoke/run.mjs plan \
            --output "$EVIDENCE_ROOT/plan" \
            --majors "$REQUESTED_MAJORS" --build-xcode "$BUILD_XCODE"

      - name: Build one unsigned Regression Simulator app
        env:
          RABBY_MOBILE_KR_PWD: ${{ secrets.RABBY_MOBILE_KR_PWD }}
          RABBY_MOBILE_CODE: ${{ secrets.RABBY_MOBILE_CODE2 }}
          RABBY_MOBILE_SAFE_API_KEY: ${{ secrets.MOBILE_SAFE_API_KEY }}
          RABBY_MOBILE_FE_SERVICE_URL: ${{ vars.RABBY_MOBILE_FE_SERVICE_URL || vars.RABBY_MOBILE_PUSH_TEST_SERVER_URL }}
        run: |
          corepack enable
          bash apps/mobile/scripts/ci/build-ios-simulator.sh --output-dir "$EVIDENCE_ROOT/build"

      - name: Test the same app on every required runtime
        run: |
          node scripts/ios-startup-smoke/run.mjs test \
            --plan "$EVIDENCE_ROOT/plan/plan.json" \
            --app "$EVIDENCE_ROOT/build/RabbyMobile.app" \
            --metadata "$EVIDENCE_ROOT/build/metadata.json" \
            --output "$EVIDENCE_ROOT/tests"

      - name: Preserve app archive and startup evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-startup-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.EVIDENCE_ROOT }}/plan
            ${{ env.EVIDENCE_ROOT }}/build/*.json
            ${{ env.EVIDENCE_ROOT }}/build/*.zip
            ${{ env.EVIDENCE_ROOT }}/build/*.txt
            ${{ env.EVIDENCE_ROOT }}/build/*.log
            ${{ env.EVIDENCE_ROOT }}/tests/results.json
            ${{ env.EVIDENCE_ROOT }}/tests/summary.md
            ${{ env.EVIDENCE_ROOT }}/tests/ios-*
