name: Mobile Integration Tests

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/mobile_integration_test.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'skills/rabby-mobile-testing/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/mobile_integration_test.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'skills/rabby-mobile-testing/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: mobile-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile_integration:
    name: apps/mobile integration
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
    runs-on:
      - self-hosted
      - macOS
      - mobile-local
    timeout-minutes: 20
    env:
      JEST_CACHE_DIRECTORY: ${{ github.workspace }}/.ci-cache/jest-mobile-integration
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_HARDENED_MODE: '0'

    steps:
      - name: Checkout git repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: false

      - name: Clean workspace while retaining JS caches
        run: |
          git reset --hard HEAD
          git clean -ffdx \
            -e .yarn/cache \
            -e .ci-cache

      - name: Use runner Node.js
        run: |
          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"
          nvm use 22
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
          echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build workspace packages
        run: yarn build

      - name: Validate integration test boundaries
        run: yarn workspace rabby-mobile test:integration:boundaries

      - name: Run mobile integration tests
        run: >-
          yarn workspace rabby-mobile test:integration
          --cacheDirectory "$JEST_CACHE_DIRECTORY"
