name: Mobile Integration Tests

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/mobile_integration_test.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'skills/rabby-mobile-testing/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/mobile_integration_test.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'skills/rabby-mobile-testing/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: mobile-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile_integration:
    name: apps/mobile integration
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
    runs-on:
      - self-hosted
      - macOS
      - mobile-local
    timeout-minutes: 20
    env:
      JEST_CACHE_DIRECTORY: ${{ github.workspace }}/.ci-cache/jest-mobile-integration
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_HARDENED_MODE: '0'

    steps:
      - name: Checkout git repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: false

      - name: Clean workspace while retaining JS caches
        run: |
          git reset --hard HEAD
          git clean -ffdx \
            -e node_modules \
            -e 'apps/*/node_modules' \
            -e 'packages/*/node_modules' \
            -e .yarn/cache \
            -e .yarn/install-state.gz \
            -e .yarn/unplugged \
            -e .ci-cache

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate integration test boundaries
        run: yarn workspace rabby-mobile test:integration:boundaries

      - name: Run mobile integration tests
        run: >-
          yarn workspace rabby-mobile test:integration
          --cacheDirectory "$JEST_CACHE_DIRECTORY"
