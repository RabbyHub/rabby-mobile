name: Mobile Integration Tests

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/mobile_integration_test.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'skills/rabby-mobile-testing/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/mobile_integration_test.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'skills/rabby-mobile-testing/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: mobile-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile_integration:
    name: apps/mobile integration
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
    runs-on:
      - self-hosted
      - macOS
      - mobile-local
    timeout-minutes: 20
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_HARDENED_MODE: '0'

    steps:
      - name: Prepare isolated checkout
        run: |
          # Keep `.ci-source` between runs: re-creating node_modules costs
          # ~2 minutes in Yarn's node-modules link step on this runner. The
          # checkout/clean steps below still reset tracked files and drop
          # untracked files except node_modules + the Yarn install state.
          mkdir -p \
            "$RUNNER_TEMP/rabby-mobile-integration-jest" \
            "$RUNNER_TEMP/rabby-mobile-integration-yarn"
          {
            echo "JEST_CACHE_DIRECTORY=$RUNNER_TEMP/rabby-mobile-integration-jest"
            echo "YARN_CACHE_FOLDER=$RUNNER_TEMP/rabby-mobile-integration-yarn"
          } >> "$GITHUB_ENV"

      - name: Checkout git repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # clean: false keeps the warm node_modules from the previous run.
          clean: false
          path: .ci-source

      - name: Clean isolated checkout
        working-directory: .ci-source
        run: |
          git reset --hard HEAD
          git clean -ffdx -e node_modules -e .yarn/install-state.gz

      - name: Use runner Node.js
        working-directory: .ci-source
        run: |
          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"
          nvm use 22
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
          echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"

      - name: Enable Corepack
        working-directory: .ci-source
        run: corepack enable

      - name: Install dependencies
        working-directory: .ci-source
        run: yarn install --immutable

      - name: Build workspace packages
        working-directory: .ci-source
        run: yarn build

      - name: Validate integration test boundaries
        working-directory: .ci-source
        run: yarn workspace rabby-mobile test:integration:boundaries

      - name: Run mobile integration tests
        working-directory: .ci-source
        run: >-
          yarn workspace rabby-mobile test:integration
          --cacheDirectory "$JEST_CACHE_DIRECTORY"
