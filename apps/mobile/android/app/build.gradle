apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

def metroMaxWorkers = System.getenv("RABBY_MOBILE_METRO_MAX_WORKERS")
def metroNodeMaxOldSpaceSize = System.getenv("RABBY_MOBILE_METRO_NODE_MAX_OLD_SPACE_SIZE")
def metroBundleCli = file("../../scripts/metro-bundle-cli.js")
def metroNodeExecutableAndArgs = ["node"]
def metroExtraPackagerArgs = []

if (metroNodeMaxOldSpaceSize) {
    metroNodeExecutableAndArgs += ["--max-old-space-size=${metroNodeMaxOldSpaceSize}"]
}

if (metroMaxWorkers) {
    metroExtraPackagerArgs += ["--max-workers", metroMaxWorkers]
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    cliFile = metroBundleCli

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    if (!metroNodeExecutableAndArgs.isEmpty()) {
        nodeExecutableAndArgs = metroNodeExecutableAndArgs
    }
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    if (!metroExtraPackagerArgs.isEmpty()) {
        extraPackagerArgs = metroExtraPackagerArgs
    }

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

def mobileProjectDir = rootProject.projectDir.parentFile
def workspaceProjectDir = mobileProjectDir.parentFile.parentFile
def buildInfoScript = new File(mobileProjectDir, "scripts/resolve-build-info.js")
def buildInfoJson = providers.exec {
    workingDir workspaceProjectDir
    commandLine "node", buildInfoScript.absolutePath
}.standardOutput.asText.get().trim()
def generatedBuildInfoAssetsDir = layout.buildDirectory.dir("generated/rabbyBuildInfo/assets")
def generatedBuildInfoFile = generatedBuildInfoAssetsDir.map {
    it.file("rabby-build-info.json")
}
def generateRabbyBuildInfo = tasks.register("generateRabbyBuildInfo") {
    inputs.property("rabbyBuildInfo", buildInfoJson)
    outputs.file(generatedBuildInfoFile)

    doLast {
        def outputFile = generatedBuildInfoFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = "${buildInfoJson}\n"
    }
}
def workspaceBundleInputs = files(
    fileTree(new File(workspaceProjectDir, "packages")) {
        include "**/*.js", "**/*.jsx", "**/*.json", "**/*.ts", "**/*.tsx"
        exclude "**/.cxx/**", "**/android/build/**", "**/ios/build/**", "**/node_modules/**"
    },
    fileTree(new File(workspaceProjectDir, ".yarn/patches")) {
        include "**/*.patch"
    },
    fileTree(mobileProjectDir) {
        include ".env", ".env.*"
    },
    new File(mobileProjectDir, "babel.config.js"),
    new File(mobileProjectDir, "metro.config.js"),
    new File(mobileProjectDir, "package.json"),
    new File(workspaceProjectDir, "package.json"),
    new File(workspaceProjectDir, "yarn.lock")
)

tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach {
    inputs.files(workspaceBundleInputs)
        .withPropertyName("rabbyWorkspaceBundleInputs")
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    inputs.property("rabbyAppEnvironment", System.getenv("APP_ENV") ?: "")
    inputs.property(
        "rabbyMobileBuildEnvironment",
        System.getenv("RABBY_MOBILE_BUILD_ENV") ?: ""
    )
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute().text.trim(), "../sentry.gradle")

// 必须放在 android {} 前，不然 agp 组装配置的时候会忽略它
if (project.hasProperty('hashcheck')) {
    apply from: 'hashcheck.gradle'
}

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.debank.rabbymobile"
    defaultConfig {
        applicationId "com.debank.rabbymobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 100238
        versionName "0.6.84"
        missingDimensionStrategy "store", "play"
        externalNativeBuild {
          cmake {
            arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
          }
        }
    }
    splits {
        abi {
            reset()
            enable false
            universalApk false  // If true, also generate a universal APK
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            } else if (System.getenv("RABBY_MOBILE_ANDROID_STORE_FILE") != null) {
                storeFile file(System.getenv("RABBY_MOBILE_ANDROID_STORE_FILE"))
                storePassword System.getenv("RABBY_MOBILE_ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("RABBY_MOBILE_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("RABBY_MOBILE_ANDROID_KEY_PASSWORD")
            }
        }
    }
    // flavorDimensions "buildchannel"
    // productFlavors {
    //   regression {
    //     dimension "buildchannel"
    //     applicationIdSuffix ".regression"
    //     versionNameSuffix "-regression"
    //     // resValue "string", "app_name", "Reg Rabby Wallet"
    //   }
    // }
    buildTypes {
        debug {
            // defaultConfig.minSdkVersion 24
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            // debuggable true
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            // shrinkResources enableProguardInReleaseBuilds
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        hash {
          initWith release
          signingConfig null
          proguardFile "proguard-hashcheck.pro"
          matchingFallbacks = ['release']
        }
        regression {
            initWith release
            applicationIdSuffix ".regression"
            matchingFallbacks = ['release']
        }
    }
    buildTypes.each {
        it.buildConfigField 'String', 'rabbitCode', "\"$System.env.RABBY_MOBILE_CODE\""
    }
    sourceSets {
        main {
            assets.srcDir generatedBuildInfoAssetsDir
            java.srcDirs += ["src/oldarch"]
        }
    }
}

tasks.configureEach {
    if (name == "preBuild" || (name.startsWith("merge") && name.endsWith("Assets"))) {
        dependsOn(generateRabbyBuildInfo)
    }
}

androidComponents {
  onVariants(selector().withBuildType("debug")) {
    // packaging.jniLibs.pickFirsts.add('lib/**/libssl.so')
    packaging.jniLibs.pickFirsts.add('lib/**/libcrypto.so')
  }

  // for allVariants
  onVariants(selector().all()) {
    packaging.jniLibs.pickFirsts.add('lib/**/libjsi.so')
    packaging.jniLibs.pickFirsts.add('lib/**/libreactnative.so')
  }
}

dependencies {
    implementation project(':rabby-native-openapi')

    implementation 'com.google.firebase:firebase-bom:33.2.0'

    implementation 'com.google.firebase:firebase-analytics:17.4.1'
    // implementation("com.google.firebase:firebase-analytics")
    // implementation project(path: ":@react-native-firebase_analytics")
    // implementation project(path: ":@react-native-firebase_messaging")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // implementation 'com.squareup.okhttp3:logging-interceptor:5.1.0'
    // implementation 'com.squareup.okhttp3:okhttp:5.1.0'
    // implementation 'com.squareup.okhttp3:okhttp-urlconnection:5.1.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // implementation project(':isudaji_react-native-install-apk')

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'
    implementation 'com.android.billingclient:billing:7.0.0'
}
